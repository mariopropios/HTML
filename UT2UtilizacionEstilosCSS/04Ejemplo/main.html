<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Columnas y box-sizing</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h2>Fila A: content-box</h2>
    <div class="contenedor">
        <div class="fila fila-a">
            <div class="columna lateral">Lateral 30%</div>
            <div class="columna principal">Principal 70%</div>
        </div>
    </div>

    <h2>Fila B: border-box</h2>
    <div class="contenedor">
        <div class="fila fila-b">
            <div class="columna lateral">Lateral 30%</div>
            <div class="columna principal">Principal 70%</div>
        </div>
    </div>
</body>
</html>
